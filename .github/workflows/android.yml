name: Build Android Debug APK (Capacitor)

on:
  push:
    branches: ['main']
  workflow_dispatch:

jobs:
  build-android-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web bundle with offline 3D models
        run: npm run build

      - name: Add Capacitor Android project (if not committed)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync web assets and bundled models into Android APK
        run: npx cap sync android

      - name: Setup Java (Temurin — JDK 21 for Capacitor 8; use 17 if downgraded to Capacitor 6)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flapatlas-3d-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
